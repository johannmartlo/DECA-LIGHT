[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deca-light"
version = "0.1.0"
description = "Aplicación ligera para automatización y control administrativo de DeCA para Tomates de Autor S.L."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Tomates de Autor S.L." }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "reportlab>=4.2.5",
    "segno>=1.6.1",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.6.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: pruebas de integración y concurrencia contra PostgreSQL real",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "instance",
    "app.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "B008",  # Permitir Depends() en parámetros de ruta FastAPI
]
